[project]
name = "local-multimodal-agent"
version = "0.1.0"
description = "Local multimodal agent over an OpenAI-compatible backend"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # Only to build a PDF that has a text layer. pypdf reads one and can write
    # only blank pages, so without this the page-boundary test skips — and a
    # test that skips is a test that does not exist.
    "reportlab>=4.2",
]
app = [
    "httpx>=0.28",
    "pydantic-settings>=2.6",
    # The write boundary around a command on native Windows: a restricted
    # token and the workspace's ACL (`app/tools/shell_windows.py`).
    "pywin32>=306; sys_platform == 'win32'",
]
# LangGraph pulls langchain-core in transitively. Being installed is not
# permission to import it; see DECISIONS.md.
agent = [
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "websockets>=15.0",
]
# Reading what a person sends. Both are pure Python and small, and both are
# parsers pointed at untrusted input, which is why they are the only two: every
# extra format is another parser with the same exposure.
documents = [
    "pypdf>=5.1",
    "python-docx>=1.1",
    # The same PDFium that renders PDFs inside Chrome, as a library. A page
    # becomes a picture without a browser process and without the viewer's own
    # toolbar in the frame, and the page is chosen by number rather than by
    # emulating a scroll.
    "pypdfium2>=4.30",
    # pypdfium2 renders into a raw bitmap; this is what turns one into a PNG.
    "pillow>=11.0",
]
ui = [
    "chainlit>=2.0",
]
# Only for deploying the model endpoint in `deploy/modal/`. The application
# never imports modal; it reaches the endpoint over MODEL_ENDPOINT like any
# other OpenAI-compatible server.
deploy = [
    "fastapi>=0.115",
    "modal>=1.0",
]
# The deployed profile's conversation store. Not installed locally by default:
# the local profile keeps using SQLite, and `app/memory/open.py` imports this
# driver only when a database URL is configured.
# The harness as an MCP server (`tools/mcp_server.py`, roadmap 25) and, later,
# MCP servers as the assistant's tools (26). Held below 2 because Chainlit
# pins `mcp<2` (2.12.0, 2026-09-12); the 1.x SDK speaks protocol 2025-11-25,
# which Claude Code and Codex accept.
mcp = [
    "mcp>=1.29,<2",
    # The reference time server, the first MCP server the assistant uses
    # (`[mcp.servers.time]`); also in the deployed image.
    "mcp-server-time>=2025.8",
]
postgres = [
    "psycopg[binary]>=3.2",
    "langgraph-checkpoint-postgres>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
