# Settings that are not secrets. Read below the environment: a line in `.env`
# or the platform secret still wins, so this file never has to hold a key.
# Secrets (tokens, API keys, database URLs) live in `.env`, see `env.example`.
# The deployed image carries this file beside the source, so a change here is
# a commit and a control-plane deploy. `docs/OPERATIONS_MAP.md`, Configuration.

[model]
# The set the assistant talks to. Each set below is one endpoint; its key is
# `MODEL_<SET>_API_KEY` in `.env`, everything else is here.
chosen = "or"

# Unnamed set: the plain `MODEL_*` lines, a local vLLM server by default.
endpoint = "http://127.0.0.1:8000/v1"
name = "gemma-4-12b-it"

[model.sets.or]
# GLM 5.3 Flash through OpenRouter, the default since 2026-09-06. One host;
# the second is asked only after the first has failed the client's retries.
endpoint = "https://openrouter.ai/api/v1"
name = "z-ai/glm-5.3-flash"
auth_style = "bearer"
providers = ["novita/fp8", "z-ai/fp8"]
extra_body = { thinking = { type = "disabled" }, reasoning_effort = "low" }
dump_dir = "/workspaces/.dumps"
context_tokens = 262144

[model.sets.gemini]
# Gemini 3.1 Flash-Lite through OpenRouter; paused until its cache lands
# (roadmap item 13).
endpoint = "https://openrouter.ai/api/v1"
name = "google/gemini-3.1-flash-lite"
auth_style = "bearer"
providers = ["google-ai-studio/flex", "google-ai-studio"]
dump_dir = "/workspaces/.dumps"
context_tokens = 262144

[model.sets.comet]
# GLM 5.3 Flash through CometAPI, kept as a set; slower than OpenRouter
# (report 2026-09-06 §11).
endpoint = "https://api.cometapi.com/v1"
name = "glm-5.3-flash"
auth_style = "bearer"
extra_body = { tool_stream = true }
context_tokens = 262144

[model.sets.int4]
# Qwen3.8-27B INT4 on the Modal App `assistant-llm-qwen-int4`; proxy token in
# `MODEL_INT4_API_KEY`. The ceiling is read from the server.
endpoint = "https://grigoriy-v--assistant-llm-qwen-int4-server-serve.modal.run/v1"
name = "qwen3.8-27b-int4"
auth_style = "modal_proxy"

[model.sets.qwen]
endpoint = "https://grigoriy-v--assistant-llm-qwen-server-serve.modal.run/v1"
name = "qwen3.8-27b"
auth_style = "modal_proxy"

[model.sets.v2]
# Gemma 4 12B on `assistant-llm-v2`.
endpoint = "https://grigoriy-v--assistant-llm-v2-server-serve.modal.run/v1"
name = "gemma-4-12b-it"
auth_style = "modal_proxy"

[model.sets.tuned]
# Gemma 4 12B with the v1 LoRA of roadmap 24 merged in, served by the
# training repository's `pinocchio-tune-serve` App on the second Modal
# workspace (bf16 on an L40S). Its key is that workspace's own proxy token,
# `MODEL_TUNED_API_KEY`; the shared `MODEL_API_KEY` belongs to the first
# workspace and does not open it. Never the default: a measuring stick.
endpoint = "https://grigoriy98smile--pinocchio-tune-serve-server-serve.modal.run/v1"
name = "gemma-4-12b-tuned"
auth_style = "modal_proxy"

[model.sets.base]
# The same Gemma 4 12B untuned, bf16, served by the same App code on the
# same workspace and card: the "before" of the roadmap 24 measurement, so
# that the two endpoints differ in nothing but the weights. Same key as
# `tuned` (one workspace, one proxy token).
endpoint = "https://grigoriy98smile--pinocchio-tune-serve-base-server-serve.modal.run/v1"
name = "gemma-4-12b-base"
auth_style = "modal_proxy"

[model.sets.dpo]
# The same Gemma 4 12B with the DPO adapter of the fine-tune queue's item 1
# merged in (loop pairs, two A10s, 2026-09-12), served by the same App code
# on the same workspace and card as `base` and `tuned`; reads `tuned`'s key
# (`MODEL_TUNED_API_KEY`), one variable for the workspace's proxy token.
endpoint = "https://grigoriy98smile--pinocchio-tune-serve-dpo-server-serve.modal.run/v1"
name = "gemma-4-12b-dpo"
auth_style = "modal_proxy"
key_of = "tuned"

[agent]
# The PostgreSQL schema the deployed store, checkpoints, inbox and telemetry
# live in (the URL itself is a secret in `.env`). Ignored by the local SQLite.
database_schema = "assistant"
# After how many seconds of work a turn is asked, between two steps, whether
# it is on track; again after each further interval. No ceiling on steps,
# calls or seconds. Zero asks never.
turn_check_seconds = 360
# The share of a reported context ceiling one request may occupy; a set's
# `context_tokens` names the budget where the server reports none.
context_fraction = 0.8
keep_turns = 2
keep_results = 2
retrieved_facts = 5
stream_answers = true
telemetry = true
# Every model call written as the model saw it, one file per run, for a
# fine-tune's data (roadmap 24). Empty is off; the deployed image sets
# `AGENT_TRAJECTORIES` to a folder on the workspaces Volume.
trajectories = ""

[telegram]
api_base = "https://api.telegram.org"
poll_timeout = 25
open_access = false

[web]
search_results = 5
fetch_timeout = 20
max_redirects = 3
max_bytes = 1000000
viewport_width = 1200
viewport_height = 900

# MCP servers the assistant uses as tools (roadmap 26). A server here is a
# capability `mcp.<name>`, granted with the defaults; `tools` is the
# allowlist (a tool not named does not exist to the model); `read_only` names
# the tools the owner vouches for, which run without approval — every other
# allowed tool asks first, because a server's own annotations are hints.
# `token` names the `.env` key sent as a bearer header; never the value.
[mcp.servers.time]
transport = "stdio"
# The reference server, installed with the `mcp` group (`python -m`, so the
# deployed image needs no `uvx`).
command = ["python", "-m", "mcp_server_time"]
tools = ["get_current_time", "convert_time"]
read_only = ["get_current_time", "convert_time"]

[mcp.servers.github]
transport = "http"
url = "https://api.githubcopilot.com/mcp/"
token = "MCP_GITHUB_TOKEN"
tools = ["get_file_contents", "list_issues", "get_issue", "search_code", "list_commits"]
read_only = ["get_file_contents", "list_issues", "get_issue", "search_code", "list_commits"]
